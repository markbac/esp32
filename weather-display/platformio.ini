; Weather station firmware for two boards sharing one core:
;   feather_s3_reverse_tft  Adafruit Feather ESP32-S3 Reverse TFT (240x135)
;   crowpanel_7             Elecrow CrowPanel 7" Basic ESP32-S3 HMI (800x480 touch)
;
; Shared code lives in src/core and include/; each board has its own folder
; under src/ with its main.cpp and UI.
;
;   pio run -e crowpanel_7 -t upload
;   pio run -e feather_s3_reverse_tft -t upload

[platformio]
default_envs = crowpanel_7

[common]
platform = espressif32
framework = arduino
monitor_speed = 115200
; Drops PNGdec's unused ESP32-S3 SIMD assembly (needs esp-dsp headers).
extra_scripts = pre:scripts/skip_png_simd.py
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    bitbank2/PNGdec@^1.0.3

[env:feather_s3_reverse_tft]
platform = ${common.platform}
framework = ${common.framework}
board = adafruit_feather_esp32s3_reversetft
monitor_speed = ${common.monitor_speed}
upload_speed = 921600
; 1.9 MB app slots (OTA still possible) - the default 1.4 MB is nearly full.
board_build.partitions = min_spiffs.csv
extra_scripts = ${common.extra_scripts}
build_src_filter = +<core/> +<feather/>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Isrc/feather
lib_deps =
    ${common.lib_deps}
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    adafruit/Adafruit MAX1704X@^1.0.3
    adafruit/Adafruit LC709203F@^1.3.4

[env:crowpanel_7]
platform = ${common.platform}
framework = ${common.framework}
; ESP32-S3-WROOM-1-N4R8: 4 MB quad flash, 8 MB octal PSRAM. USB is a CH340 on UART0.
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 4MB
board_build.partitions = partitions/crowpanel_4mb.csv
monitor_speed = ${common.monitor_speed}
upload_speed = 921600
extra_scripts = ${common.extra_scripts}
build_src_filter = +<core/> +<crowpanel/>
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -Isrc/crowpanel
    -DHOSTNAME=\"weather7\"
    -DDAILY_DAYS=7
    -DHOURLY_COLUMNS=24
    -DHOURLY_STEP=1
    -DRADAR_VIEW_W=520
    -DRADAR_VIEW_H=380
    -DRADAR_FRAMES=9
    -DHISTORY_DAYS=90
    -DENABLE_HOMELAB=1
lib_deps =
    ${common.lib_deps}
    lovyan03/LovyanGFX@^1.2.7
